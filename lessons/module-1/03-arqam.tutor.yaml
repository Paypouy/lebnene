steps:
- id: '1'
  type: respond
  prompt: You're at the phone shop. Say hi and that you want a new SIM.
  expect:
    ar: مرحبا، بدّي خط جديد.
    tr: mar7aba, baddé khatt jdid.
  accept:
  - baddé khatt jdid
  hint: baddé = I want; khatt jdid = new SIM
- id: '2'
  type: respond
  say:
    ar: تكرم. معك باسبور؟
    tr: tekram. ma3ak basbor?
    en: Sure. Got your passport?
  prompt: Say yes, hand it over, and ask how much the SIM is.
  expect:
    ar: إي، تفضّل. قدّي الخط؟
    tr: é, tfaddal. 2addé lkhatt?
  accept:
  - é 2addé lkhatt
  - é tfaddal 2addé
  - 2addé lkhatt
  hint: é = yes; tfaddal = here you go; 2addé = how much (price)
  gender_variants:
    f:
      say:
        ar: معك باسبور؟
        tr: ma3ik basbor?
        en: Got your passport? (f)
- id: '3'
  type: present
  say:
    ar: خمسطعش دولار.
    tr: khamsta3sh dolar.
    en: Fifteen dollars.
- id: '4'
  type: respond
  prompt: Say okay, and ask what your number is.
  expect:
    ar: تمام. وشو رقمي؟
    tr: tamém. w shu ra2mé?
  accept:
  - shu ra2mé
  - tamém shu ra2mé
  hint: shu = what; ra2mé = my number
- id: '5'
  type: present
  say:
    ar: صفر تلاتة، سبع ميّة وتمانة وأربعين، تنين وعشرين.
    tr: sefer tlété, sab3 miyyé w tméné w arb3in, tnén w 3eshrin.
    en: 03 748 22
- id: '6'
  type: respond
  prompt: 'Say: one moment, I''m writing…'
  expect:
    ar: لحظة، عم بكتب…
    tr: la7za, 3am bektob…
  accept:
  - la7za
  hint: la7za = one moment; 3am bektob = I'm writing
- id: '7'
  type: translate
  direction: ar-en
  say:
    ar: واحد وعشرين
    tr: wé7ad w 3eshrin
    en: '21'
  expect:
    en: '21'
  accept:
  - twenty-one
  - twenty one
- id: '8'
  type: translate
  direction: ar-en
  say:
    ar: خمسطعش
    tr: khamsta3sh
    en: '15'
  expect:
    en: '15'
  accept:
  - fifteen
- id: '9'
  type: translate
  prompt: '100'
  expect:
    ar: مية
    tr: miyyé
- id: '10'
  type: translate
  prompt: '1000'
  expect:
    ar: ألف
    tr: alf
- id: '11'
  type: translate
  prompt: 20 dollars (11 and up take the singular noun)
  expect:
    ar: عشرين دولار
    tr: 3eshrin dolar
  hint: 3eshrin + dolar, not dolarat
- id: '12'
  type: respond
  prompt: 'Which word asks the price: kam or 2addé?'
  expect:
    ar: قدّي؟
    tr: 2addé?
  hint: kam counts things; the other one asks the price
- id: '13'
  type: respond
  prompt: 'The seller says: tlété w tlétin dolar (33 dollars). Say it''s too expensive and offer 20.'
  expect:
    ar: كتير غالي! عشرين؟
    tr: ktir ghalé! 3eshrin?
  accept:
  - ghalé ktir 3eshrin
  - ktir ghalé
  hint: ktir ghalé = too expensive
- id: '14'
  type: substitute
  prompt: Say the price in dollars (11 and up take the singular dolar).
  pattern: '{item} dolar'
  items:
  - 3eshrin
  - miyyé
  - alf
